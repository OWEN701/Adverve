<!-- Adbot Widget Styles -->
<style>
  .adbot-chat-button {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
    color: white;
    border: none;
    border-radius: 50%;
    padding: 16px;
    box-shadow: 0 20px 25px -5px rgba(6, 182, 212, 0.3), 0 8px 10px -6px rgba(6, 182, 212, 0.1);
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 999999;
    position: relative;
  }

  .adbot-chat-button:hover {
    background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
    transform: scale(1.1);
  }

  .adbot-chat-button svg {
    width: 24px;
    height: 24px;
    display: block;
  }

  .adbot-chat-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #ef4444;
    color: white;
    font-size: 12px;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: adbotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .adbot-chat-tooltip {
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 8px;
    background: #0f172a;
    color: white;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    pointer-events: none;
  }

  .adbot-chat-button:hover .adbot-chat-tooltip {
    opacity: 1;
  }

  .adbot-chat-window {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 380px;
    height: 600px;
    background: #0f172a;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    border: 1px solid #334155;
    display: none;
    flex-direction: column;
    z-index: 999999;
    animation: adbotSlideUp 0.3s ease-out;
  }

  .adbot-chat-window.active {
    display: flex;
  }

  @keyframes adbotSlideUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes adbotPulse {
    0%, 100% {
      opacity: 1;
    }
    50% {
      opacity: 0.5;
    }
  }

  .adbot-header {
    background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
    padding: 16px;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .adbot-header-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .adbot-header-icon {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    padding: 8px;
  }

  .adbot-header-icon svg {
    width: 20px;
    height: 20px;
    color: white;
    display: block;
  }

  .adbot-header-text h3 {
    font-weight: 600;
    color: white;
    margin: 0;
    font-size: 16px;
  }

  .adbot-header-status {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }

  .adbot-status-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    animation: adbotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  .adbot-status-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.9);
  }

  .adbot-close-btn {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.8);
    border: none;
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .adbot-close-btn:hover {
    color: white;
    background: rgba(255, 255, 255, 0.2);
  }

  .adbot-close-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .adbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #020617;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .adbot-message {
    display: flex;
  }

  .adbot-message.user {
    justify-content: flex-end;
  }

  .adbot-message.assistant {
    justify-content: flex-start;
  }

  .adbot-message-bubble {
    max-width: 80%;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
  }

  .adbot-message.user .adbot-message-bubble {
    background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
    color: white;
  }

  .adbot-message.assistant .adbot-message-bubble {
    background: #1e293b;
    color: #f1f5f9;
  }

  .adbot-typing {
    display: flex;
    justify-content: flex-start;
  }

  .adbot-typing-bubble {
    background: #1e293b;
    border-radius: 16px;
    padding: 12px 16px;
  }

  .adbot-spinner {
    width: 20px;
    height: 20px;
    color: #06b6d4;
    animation: adbotSpin 1s linear infinite;
  }

  @keyframes adbotSpin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  .adbot-input-area {
    padding: 16px;
    border-top: 1px solid #334155;
    background: #0f172a;
    border-radius: 0 0 16px 16px;
  }

  .adbot-input-container {
    display: flex;
    gap: 8px;
  }

  .adbot-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: white;
    outline: none;
    transition: border-color 0.2s;
  }

  .adbot-input::placeholder {
    color: #94a3b8;
  }

  .adbot-input:focus {
    border-color: #06b6d4;
  }

  .adbot-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .adbot-send-btn {
    background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .adbot-send-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
    transform: scale(1.05);
  }

  .adbot-send-btn:disabled {
    background: #334155;
    cursor: not-allowed;
    transform: scale(1);
  }

  .adbot-send-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  @media (max-width: 640px) {
    .adbot-chat-window {
      width: calc(100vw - 32px);
      height: calc(100vh - 32px);
      bottom: 16px;
      right: 16px;
    }
  }
</style>

<!-- Chat Button -->
<button id="adbot-button" class="adbot-chat-button" aria-label="Open chat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <span class="adbot-chat-badge">1</span>
  <span class="adbot-chat-tooltip">Chat with us!</span>
</button>

<!-- Chat Window -->
<div id="adbot-window" class="adbot-chat-window">
  <!-- Header -->
  <div class="adbot-header">
    <div class="adbot-header-info">
      <div class="adbot-header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <div class="adbot-header-text">
        <h3>Adbot</h3>
        <div class="adbot-header-status">
          <div class="adbot-status-dot"></div>
          <span class="adbot-status-text">Online</span>
        </div>
      </div>
    </div>
    <button id="adbot-close" class="adbot-close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Messages -->
  <div id="adbot-messages" class="adbot-messages"></div>

  <!-- Input -->
  <div class="adbot-input-area">
    <div class="adbot-input-container">
      <input
        type="text"
        id="adbot-input"
        class="adbot-input"
        placeholder="Type your message..."
      />
      <button id="adbot-send" class="adbot-send-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SUPABASE_URL = 'https://lybjywojcbwrnzohiija.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5Ymp5d29qY2J3cm56b2hpaWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyMjQzMTEsImV4cCI6MjA3NjgwMDMxMX0.O6NDTbVK1YtVQGkr8-mGN13Ja5zT9qYGMq9EDG2eA44';

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var isOpen = false;
  var messages = [];
  var conversationId = null;
  var isLoading = false;
  var chatStep = 'greeting';
  var sessionId = localStorage.getItem('adverve_session_id');

  if (!sessionId) {
    sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('adverve_session_id', sessionId);
  }

  var button = document.getElementById('adbot-button');
  var chatWindow = document.getElementById('adbot-window');
  var closeBtn = document.getElementById('adbot-close');
  var messagesContainer = document.getElementById('adbot-messages');
  var input = document.getElementById('adbot-input');
  var sendBtn = document.getElementById('adbot-send');

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function renderMessage(role, message) {
    var messageEl = document.createElement('div');
    messageEl.className = 'adbot-message ' + role;

    var bubbleEl = document.createElement('div');
    bubbleEl.className = 'adbot-message-bubble';
    bubbleEl.textContent = message;

    messageEl.appendChild(bubbleEl);
    messagesContainer.appendChild(messageEl);
    scrollToBottom();
  }

  function showTyping() {
    var typingEl = document.createElement('div');
    typingEl.id = 'adbot-typing';
    typingEl.className = 'adbot-typing';
    typingEl.innerHTML = '<div class="adbot-typing-bubble"><svg class="adbot-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></div>';
    messagesContainer.appendChild(typingEl);
    scrollToBottom();
  }

  function hideTyping() {
    var typingEl = document.getElementById('adbot-typing');
    if (typingEl) {
      typingEl.remove();
    }
  }

  function addMessage(role, message) {
    messages.push({ role: role, message: message });
    renderMessage(role, message);

    if (conversationId) {
      supabaseClient
        .from('chat_messages')
        .insert({
          conversation_id: conversationId,
          role: role,
          message: message
        })
        .then(function() {});
    }
  }

  function initializeChat() {
    supabaseClient
      .from('chat_conversations')
      .insert({ session_id: sessionId })
      .select()
      .single()
      .then(function(result) {
        if (result.data) {
          conversationId = result.data.id;
          addMessage('assistant', "Hi! I'm Adbot, Adverve's AI assistant. I'd love to learn more about your business and see how we can help you grow. What's your name?");
        }
      });
  }

  function extractName(input) {
    var cleanInput = input.trim();
    var patterns = [
      /(?:my name is|i'm|im|i am|this is|call me)\s+([a-z]+)/i,
      /^([a-z]+)$/i,
      /^([a-z]+\s+[a-z]+)$/i
    ];

    for (var i = 0; i < patterns.length; i++) {
      var match = cleanInput.match(patterns[i]);
      if (match && match[1]) {
        return match[1].trim();
      }
    }

    return cleanInput;
  }

  function extractEmail(input) {
    var emailPattern = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/;
    var match = input.match(emailPattern);
    return match ? match[1] : input.trim();
  }

  function extractPhone(input) {
    var phonePattern = /([\d\s()+-]+)/;
    var match = input.match(phonePattern);
    if (match) {
      return match[1].replace(/\s+/g, ' ').trim();
    }
    return input.trim();
  }

  function capitalizeWords(str) {
    return str.split(' ').map(function(word) {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }).join(' ');
  }

  function getNextResponse(currentStep, userInput) {
    switch (currentStep) {
      case 'greeting': {
        var extractedName = extractName(userInput);
        var formattedName = capitalizeWords(extractedName);
        return {
          response: 'Nice to meet you, ' + formattedName + '! What\'s the best email to reach you?',
          nextStep: 'email',
          updateData: { visitor_name: formattedName }
        };
      }
      case 'email': {
        var extractedEmail = extractEmail(userInput);
        return {
          response: 'Perfect! And what\'s a good phone number to contact you?',
          nextStep: 'phone',
          updateData: { visitor_email: extractedEmail }
        };
      }
      case 'phone': {
        var extractedPhone = extractPhone(userInput);
        return {
          response: 'Great! Tell me a bit about your business and what challenges you\'re facing with marketing or lead generation.',
          nextStep: 'business',
          updateData: { visitor_phone: extractedPhone }
        };
      }
      case 'business':
        return {
          response: 'Thanks for sharing! Based on what you\'ve told me, I think our AI-powered lead generation and paid traffic solutions could be a perfect fit for you. We specialize in:\n\n• High-converting website creation with smart chatbots\n• AI-powered lead generation campaigns\n• Social media growth strategies\n\nWould you like to schedule a free 30-minute strategy call with our team to discuss how we can help you achieve 3-5x ROI growth?',
          nextStep: 'conversation',
          updateData: { business_info: userInput, lead_qualified: true }
        };
      default:
        return {
          response: 'That\'s a great question! Our team would love to discuss this with you in detail during a strategy call. In the meantime, feel free to explore our services on this page, or let me know if you have any other questions!',
          nextStep: 'conversation'
        };
    }
  }

  function handleSend() {
    var userMessage = input.value.trim();
    if (!userMessage || isLoading || !conversationId) return;

    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    isLoading = true;

    addMessage('user', userMessage);
    showTyping();

    setTimeout(function() {
      hideTyping();
      var result = getNextResponse(chatStep, userMessage);

      if (result.updateData) {
        supabaseClient
          .from('chat_conversations')
          .update(result.updateData)
          .eq('id', conversationId)
          .then(function() {});
      }

      addMessage('assistant', result.response);
      chatStep = result.nextStep;

      input.disabled = false;
      sendBtn.disabled = false;
      isLoading = false;
      input.focus();
    }, 1000);
  }

  button.addEventListener('click', function() {
    button.style.display = 'none';
    chatWindow.classList.add('active');
    isOpen = true;

    if (messages.length === 0) {
      initializeChat();
    }
  });

  closeBtn.addEventListener('click', function() {
    chatWindow.classList.remove('active');
    button.style.display = 'block';
    isOpen = false;
  });

  sendBtn.addEventListener('click', handleSend);

  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
})();
</script>
